<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b388eb" />
  <title>Todo Liste</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/icone.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="container">
    <h1>📝 Ma Todo Liste</h1>

    <div class="chat-container">
      <svg id="chat" width="120" height="160" viewBox="0 -20 120 160" xmlns="http://www.w3.org/2000/svg">
        <!-- Oreilles bien collées et géantes -->
        <polygon points="10,70 40,-10 70,70" fill="#9b59b6" />
        <polygon points="20,68 40,5 60,68" fill="pink" />
        <polygon points="50,70 80,-10 110,70" fill="#9b59b6" />
        <polygon points="60,68 80,5 100,68" fill="pink" />

        <!-- Tête -->
        <circle cx="60" cy="60" r="40" fill="#9b59b6" />

        <!-- Yeux (suivent le curseur, clignent, se ferment quand le chat dort) -->
        <circle class="eye" cx="45" cy="50" r="8" fill="#000" />
        <circle class="eye" cx="75" cy="50" r="8" fill="#000" />

        <!-- Nez -->
        <polygon points="60,60 56,66 64,66" fill="pink" />

        <!-- Bouche (petit sourire simple) -->
        <path d="M50 75 Q60 85 70 75" stroke="pink" stroke-width="3" fill="none" />

        <!-- Moustaches -->
        <line x1="40" y1="60" x2="20" y2="58" stroke="black" stroke-width="2"/>
        <line x1="40" y1="65" x2="20" y2="65" stroke="black" stroke-width="2"/>
        <line x1="40" y1="70" x2="20" y2="72" stroke="black" stroke-width="2"/>
        <line x1="80" y1="60" x2="100" y2="58" stroke="black" stroke-width="2"/>
        <line x1="80" y1="65" x2="100" y2="65" stroke="black" stroke-width="2"/>
        <line x1="80" y1="70" x2="100" y2="72" stroke="black" stroke-width="2"/>
      </svg>
      <span id="zzz" aria-hidden="true">💤</span>
    </div>

    <!-- Compteur de tâches + message du chat -->
    <p id="compteur" aria-live="polite"></p>

    <form id="todo-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Ajouter une tâche..."
        required
        x-webkit-speech
        speech
        autocomplete="off"
      />
      <button type="submit">Ajouter</button>
      <button type="button" id="mic-btn" aria-label="Dicter une tâche">🎤</button>
    </form>

    <ul id="todo-list"></ul>

    <button type="button" id="clear-btn" hidden>🧹 Supprimer les tâches terminées</button>
    <button type="button" id="export-btn">📤 Partager la liste</button>

    <audio id="miaou" src="assets/miaou.mp3" preload="auto"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
